name: Tests

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - "Justfile"
  pull_request:
    paths:
      - "website/**"
      - "Justfile"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: extractions/setup-just@v3
      - run: just install
      - run: cd website && npx playwright install --with-deps chromium
      - run: just test
